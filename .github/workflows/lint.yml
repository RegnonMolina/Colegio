name: Lint PowerShell

# Escopo: arquivo de produção (o que colegiomundodosaber.com.br/script entrega).
# ScriptSupremo.ps1 é uma cópia legada não auditada e fica fora do gate por ora.

on:
  push:
    paths:
      - 'MaintenanceColegio.ps1'
      - '.github/workflows/lint.yml'
  pull_request:
    paths:
      - 'MaintenanceColegio.ps1'
  workflow_dispatch:

env:
  TARGET: MaintenanceColegio.ps1

jobs:
  analyze:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

      - name: PSScriptAnalyzer (falha só em erros de severidade Error)
        shell: pwsh
        run: |
          # Regras excluídas (intencionais neste script, não são defeitos):
          #  - PSReservedParams: o param [switch]$WhatIf é proposital (alimenta os blocos de simulação).
          #  - PSAvoidUsingComputerNameHardcoded: Test-Connection ao host fixo de atualização
          #    (script.colegiomundodosaber.com.br) é um check de conectividade intencional.
          $excluir = @('PSReservedParams', 'PSAvoidUsingComputerNameHardcoded')
          $results = Invoke-ScriptAnalyzer -Path $env:TARGET -Severity @('Error','Warning') -ExcludeRule $excluir
          if ($results) {
            $results | Format-Table -AutoSize RuleName, Severity, Line, Message | Out-String | Write-Host
          }
          $errors = @($results | Where-Object Severity -eq 'Error')
          Write-Host ("Total: {0} | Erros: {1} | Avisos: {2}" -f $results.Count, $errors.Count, ($results.Count - $errors.Count))
          if ($errors.Count -gt 0) {
            Write-Error "PSScriptAnalyzer encontrou $($errors.Count) erro(s) de severidade Error."
            exit 1
          }

      - name: Checagem AST - funcoes chamadas mas nao definidas (anti-fantasma)
        # pwsh 7: o parse tem que ser em 7 (o script usa sintaxe compativel com 5.1 e 7).
        # Resolucao de comandos por SNAPSHOT unico (Get-Command em massa) em vez de Get-Command
        # por-nome: no Windows o pwsh 7 enumera tambem os modulos do Windows PowerShell
        # (Checkpoint-Computer, Optimize-Volume, Set-MpPreference, ...), evitando falso-positivo.
        shell: pwsh
        run: |
          $path = (Resolve-Path $env:TARGET).Path
          # Rede de seguranca: cmdlets so-5.1 (removidos do PS7) e de modulos opcionais.
          $allow = @('Get-WindowsUpdate','Set-MpPreference','Get-MpPreference',
                     'Checkpoint-Computer','Enable-ComputerRestore','Get-ComputerRestorePoint','Get-WmiObject')
          $tokens = $null; $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { Write-Error "Erro de sintaxe em $env:TARGET"; exit 1 }
          $defined = $ast.FindAll({ param($n) $n -is [System.Management.Automation.Language.FunctionDefinitionAst] }, $true) | ForEach-Object { $_.Name }
          $avail = @{}
          Get-Command -CommandType Cmdlet,Function,Alias,Application -ErrorAction SilentlyContinue | ForEach-Object { $avail[$_.Name] = $true }
          # Mescla os comandos do Windows PowerShell 5.1 (alvo real do script): resolve cmdlets
          # que existem no 5.1 mas nao no pwsh 7 (Checkpoint-Computer, Get-WmiObject, ...).
          try {
            $wp = & powershell.exe -NoProfile -Command "Get-Command -CommandType Cmdlet,Function,Alias -ErrorAction SilentlyContinue | ForEach-Object Name" 2>$null
            foreach ($n in $wp) { if ($n) { $avail[$n.Trim()] = $true } }
          } catch { Write-Host "Aviso: nao foi possivel mesclar comandos do Windows PowerShell 5.1." }
          $calls = $ast.FindAll({ param($n) $n -is [System.Management.Automation.Language.CommandAst] }, $true) | ForEach-Object { $_.GetCommandName() } | Where-Object { $_ -match '^[A-Za-z]+-' } | Sort-Object -Unique
          $phantoms = $calls | Where-Object { $defined -notcontains $_ -and $allow -notcontains $_ -and -not $avail.ContainsKey($_) }
          if ($phantoms) {
            Write-Host "Funcoes chamadas mas NAO definidas (nem cmdlet):"
            $phantoms | ForEach-Object { Write-Host "   $_" }
            Write-Error "Ha funcoes chamadas mas nunca definidas. Corrija antes do merge."
            exit 1
          }
          Write-Host "OK: nenhuma funcao fantasma em $env:TARGET."
